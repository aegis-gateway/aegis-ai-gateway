# demos/06-agent-compatibility — coding agent routed through AEGIS
#
# Starts PostgreSQL, Redis, and the AEGIS gateway with a custom policy
# that restricts data-exfiltration-shaped agent tasks.
#
# The agent script (agent.py) uses the openai Python package pointed at
# the gateway — no code changes, only base_url and api_key.
#
# Usage:
#   cd demos/06-agent-compatibility
#   ./run.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-demo-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-dev
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aegis-demo-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: aegis-demo-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: aegis
      DB_PASSWORD: aegis-dev
      DB_NAME: aegis
      DATABASE_URL: postgres://aegis:aegis-dev@postgres:5432/aegis?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AEGIS_SEED_DEMO_KEY: "true"
      OPA_BUNDLE_PATH: "/etc/aegis/agent-policies"
    volumes:
      - ./policies:/etc/aegis/agent-policies:ro
      # Adds the aegis-tools alias, which routes to OpenAI. Tool calling is not
      # carried by the Anthropic adapter, and every shipped alias is
      # Anthropic-primary. See the header of that file.
      - ./config/models.yaml:/etc/aegis/configs/models.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/aegis/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  redisdata:
