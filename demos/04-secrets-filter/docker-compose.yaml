# demos/04-secrets-filter — secrets scanner demonstration
#
# Brings up the full AEGIS stack (gateway + postgres + redis) with
# the built-in secrets filter enabled (it is always on by default).
#
# Usage:
#   cd demos/04-secrets-filter
#   ./run.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-demo-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-dev
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aegis-demo-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: aegis-demo-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: aegis
      DB_PASSWORD: aegis-dev
      DB_NAME: aegis
      DATABASE_URL: postgres://aegis:aegis-dev@postgres:5432/aegis?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AEGIS_SEED_DEMO_KEY: "true"
      # Set to "true" by run.sh when no provider key is present, so this demo
      # needs no credentials. It replaces the upstream call and nothing else:
      # the secrets filter, which is the whole point here, still runs for real.
      AEGIS_MOCK_PROVIDER: "${AEGIS_MOCK_PROVIDER:-}"
      # gateway.yaml resolves bundle_path as ${OPA_BUNDLE_PATH:configs/policies},
      # which is relative to the working directory. The image has no WORKDIR, so
      # the default lands on /configs/policies, the policy load fails, and the
      # evaluator stays Enabled() with a nil query — which fails closed and blocks
      # every request, including the clean one this demo expects to return 200.
      OPA_BUNDLE_PATH: "/etc/aegis/configs/policies"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/aegis/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  redisdata:
