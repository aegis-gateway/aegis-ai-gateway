# demos/00-quickstart. The canonical AEGIS quickstart stack.
#
# Do not run this file directly. `./quickstart.sh` at the repo root is the one
# documented entry point; it decides whether to run against a mock provider,
# generates the key pepper, waits for health, and prints the commands. This file
# is what it starts.
#
#   ./quickstart.sh                  gateway + Postgres + Redis, published image
#   ./quickstart.sh --build          same, built from this working tree
#   ./quickstart.sh --with-webui     also start Open WebUI on :3000
#   ./quickstart.sh verify           run the evidence sequence
#   ./quickstart.sh down             stop and delete the volumes
#
# Container names are prefixed aegis-demo- so this stack never collides with the
# contributor services in deploy/docker-compose.yaml, which use aegis-postgres
# and aegis-redis. Every documented docker exec command targets the aegis-demo-
# names; see docs/QUICKSTART-COMMANDS.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-demo-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-dev
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aegis-demo-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    # Published image by default, so a first run needs no Go toolchain and no
    # compile. `./quickstart.sh --build` layers docker-compose.build.yaml over
    # this file to build from the working tree instead.
    image: ${AEGIS_IMAGE:-ghcr.io/aegis-gateway/aegis-ai-gateway:v0.1.0}
    container_name: aegis-demo-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"
    # Optional: quickstart.sh writes provider keys here when it finds them, and
    # the stack starts without it when there are none.
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: aegis
      DB_PASSWORD: aegis-dev
      DB_NAME: aegis
      DATABASE_URL: postgres://aegis:aegis-dev@postgres:5432/aegis?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AEGIS_SEED_DEMO_KEY: "true"
      OPA_BUNDLE_PATH: "/etc/aegis/configs/policies"
      # Set to exactly "true" by quickstart.sh when no provider key is present.
      # The gateway then answers completions from internal/router/adapters/mock.go
      # instead of calling out. Every other stage of the pipeline still runs, so
      # a block is a real block. Any other value, including unset, uses the real
      # providers in configs/providers.yaml.
      AEGIS_MOCK_PROVIDER: "${AEGIS_MOCK_PROVIDER:-}"
      AEGIS_KEY_PEPPER: "${AEGIS_KEY_PEPPER:?quickstart.sh generates this; run ./quickstart.sh rather than docker compose directly}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/aegis/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Open WebUI is not part of the default quickstart. The thing worth seeing
  # here is a request being refused and leaving no payload behind, and account
  # creation in a chat UI should not stand between a reader and that. Start it
  # with `./quickstart.sh --with-webui` when a chat interface is wanted.
  webui:
    profiles: ["webui"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: aegis-demo-webui
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: http://gateway:8080/v1
      OPENAI_API_KEY: aegis-demo-quickstart
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      WEBUI_SECRET_KEY: aegis-quickstart-secret
    volumes:
      - webuidata:/app/backend/data

volumes:
  pgdata:
  redisdata:
  webuidata:
