server:
  host: "0.0.0.0"
  port: ${GATEWAY_PORT:8080}
  read_timeout: "30s"
  write_timeout: "120s"
  idle_timeout: "120s"
  graceful_shutdown: "30s"
  # Request body cap in bytes; a larger body is a 413. Image parts arrive as
  # base64 inside the JSON, so this bounds how many photos one request can
  # carry. Default 33554432 (32 MiB).
  max_request_bytes: ${AEGIS_MAX_REQUEST_BYTES:33554432}

database:
  host: "${DB_HOST:localhost}"
  port: ${DB_PORT:5432}
  name: "aegis"
  user: "${DB_USER:aegis}"
  password: "${DB_PASSWORD:aegis-dev}"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: "5m"

redis:
  addresses:
    - "${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
  password: "${REDIS_PASSWORD:}"
  db: 0
  pool_size: 50

telemetry:
  log_level: "info"
  log_format: "json"
  metrics_port: 9090
  otlp_endpoint: "${OTLP_ENDPOINT:}"
  trace_sample_rate: 0.1

filter:
  pii_service:
    address: "${PII_SERVICE_ADDR:aegis-filter-nlp:50051}"
    timeout: "5s"
    max_retries: 1
  secrets:
    enabled: true
  injection:
    enabled: true
    block_threshold: 0.9
    flag_threshold: 0.7
  policy:
    enabled: true
    bundle_path: "${OPA_BUNDLE_PATH:configs/policies}"
    evaluation_timeout: "100ms"

cost:
  # Controls what happens when a request is routed to a model that has no pricing row.
  # "deny"  — reject with HTTP 402 and write an auditable log entry (default, recommended).
  # "flag"  — proceed but emit an audit log entry and increment aegis_requests_unpriced_total.
  # "allow" — silent pass-through (dev/test only; governance bypass risk).
  on_missing_pricing: deny
  # Days since pricing.yaml verified_at before a boot-time warning is logged.
  pricing_staleness_threshold_days: ${PRICING_STALENESS_THRESHOLD_DAYS:90}

routing:
  default_timeout: "30s"
  stream_first_chunk_timeout: "60s"
  stream_chunk_timeout: "10s"
  max_retries: 2
  circuit_breaker:
    failure_threshold: 5
    error_rate_threshold: 0.5
    error_rate_window: "30s"
    recovery_probe_interval: "15s"
  health_check_interval: "10s"

# POST /v1/messages (Anthropic Messages API, used by Claude Code).
anthropic_messages:
  # anthropic-beta flags. Per flag, in order:
  #   1. not a well-formed flag (lowercase name, then a date): refused, sealed
  #   2. matches denied_betas: refused, sealed as feature_denied
  #   3. in allowed_betas: forwarded
  #   4. otherwise: unlisted_betas decides. "forward" forwards it, logs it by
  #      name and counts it in aegis_anthropic_beta_unlisted_total; "refuse"
  #      refuses it, sealed. Any other value means refuse.
  # Claude Code's flags vary by release, mode, command and install, which is
  # why the default is forward. The decoder still refuses every request
  # construct it does not allowlist, whatever flags are set.
  unlisted_betas: forward
  # The flags Claude Code 2.1.150 was observed sending. context-1m changes the
  # price of a request over 200K input tokens (priced via pricing.yaml).
  allowed_betas:
    - claude-code-20250219
    - context-1m-2025-08-07
    - interleaved-thinking-2025-05-14
    - context-management-2025-06-27
    - prompt-caching-scope-2026-01-05
    - effort-2025-11-24
    - structured-outputs-2025-12-15
    - redact-thinking-2026-02-12
    - thinking-token-count-2026-05-13
    - advanced-tool-use-2025-11-20
    - thinking-display-updates-2026-08-18
    - advisor-tool-2026-03-01
  # Feature families that move data or execution to the provider. A trailing
  # * matches by prefix.
  denied_betas:
    - files-api-*
    - mcp-client-*
    - code-execution-*
    - web-search-*
    - web-fetch-*
    - skills-*
  # One streamed response may run this long. Claude Code turns with extended
  # thinking routinely stream for many minutes. The connection's write
  # deadline is extended to match for these streams only.
  stream_total_timeout: "30m"
  # Longest gap allowed between lines of the provider stream. The provider
  # sends ping events while it works, so a live stream never reaches this.
  stream_idle_timeout: "60s"
