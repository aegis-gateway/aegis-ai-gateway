# Model routing configuration — aliases, primary routes, and fallback chains.
# Pricing data lives in configs/pricing.yaml.
models:
  # Deprecation alias: remove in the next minor version after aegis-gpt4 consumers migrate.
  aegis-gpt4:
    display_name: "AEGIS Balanced (deprecated alias → aegis-balanced)"
    deprecated_alias: "aegis-balanced"
    primary:
      provider: anthropic
      model: claude-sonnet-5
      classification_ceiling: CONFIDENTIAL
    fallback:
      - provider: openai
        model: gpt-5.6-terra
        classification_ceiling: CONFIDENTIAL

  aegis-fast:
    display_name: "AEGIS Fast (Low Latency)"
    primary:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      classification_ceiling: INTERNAL
    fallback:
      - provider: openai
        model: gpt-5.6-luna
        classification_ceiling: INTERNAL

  aegis-balanced:
    display_name: "AEGIS Balanced"
    primary:
      provider: anthropic
      model: claude-sonnet-5
      classification_ceiling: CONFIDENTIAL
    fallback:
      - provider: openai
        model: gpt-5.6-terra
        classification_ceiling: CONFIDENTIAL

  aegis-reasoning:
    display_name: "AEGIS Reasoning (Complex Tasks)"
    primary:
      provider: anthropic
      model: claude-opus-5
      classification_ceiling: CONFIDENTIAL
    fallback:
      - provider: openai
        model: gpt-5.6-sol
        classification_ceiling: CONFIDENTIAL

  # aegis-internal requires a running vLLM server — uncomment when available.
  # aegis-internal:
  #   display_name: "AEGIS Internal (Air-Gapped)"
  #   primary:
  #     provider: internal_vllm
  #     model: llama-3.1-70b
  #     endpoint: "http://vllm.internal:8000/v1"
  #     classification_ceiling: RESTRICTED
  #   fallback: []
