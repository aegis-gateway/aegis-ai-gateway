name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      # Every capability claim in the docs cites a file at a pinned commit. This
      # fails if one of those citations points at a commit where the file does
      # not exist, or at a branch. Both have happened, and a dead citation is
      # worse than no citation because it looks like evidence.
      - name: Documentation citations
        run: ./scripts/check-citations.sh

      - name: golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-dev
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Migrations run before the tests because the integration tests read the
      # real schema rather than creating their own.
      - name: Run migrations
        run: go run ./cmd/migrate -direction up
        env:
          DATABASE_URL: postgres://aegis:aegis-dev@localhost:5432/aegis?sslmode=disable

      - name: Run tests
        run: go test ./... -v -race -cover -coverprofile=coverage.out
        env:
          DATABASE_URL: postgres://aegis:aegis-dev@localhost:5432/aegis?sslmode=disable
          # The integration tests gate on TEST_DATABASE_URL, not DATABASE_URL.
          # Without it every one of them skipped, and a skip reports as a pass:
          # a defect that broke `verify-chain --event` on every invocation sat
          # behind a green Test job because the only test covering it never ran.
          TEST_DATABASE_URL: postgres://aegis:aegis-dev@localhost:5432/aegis?sslmode=disable
          REDIS_URL: localhost:6379

      # A skipped integration test is indistinguishable from a passing one in
      # the summary, so failing on a skip is what keeps the variable above from
      # being quietly dropped again.
      #
      # `tee`, not `>` and not `| grep -q`, and both halves of that matter.
      #
      # `| grep -q` was the original: grep returns at its first match, closing
      # the pipe while `go test` is still writing, so `go test` dies of SIGPIPE
      # with 141, `pipefail` reports 141 for the pipeline, the `if` reads false,
      # and the guard stays silent exactly when a skip was there to find.
      #
      # `>"$log"` fixed that and broke something else: under `set -e` a failing
      # `go test` aborts the step before anything prints, leaving an exit code
      # and no test names in the Actions log.
      #
      # `tee` has neither problem. It reads to EOF so it never closes the pipe
      # early, `pipefail` still propagates a real `go test` failure, and the
      # output is on the console either way.
      - name: Assert the integration tests actually ran
        run: |
          set -euo pipefail
          log=$(mktemp)
          go test ./internal/audit/... -count=1 -v 2>&1 | tee "$log"
          if grep -q -- "--- SKIP" "$log"; then
            echo "::error::an audit integration test skipped; TEST_DATABASE_URL is not reaching it"
            grep -- "--- SKIP" "$log"
            exit 1
          fi
          echo "no skips in the audit packages"
        env:
          DATABASE_URL: postgres://aegis:aegis-dev@localhost:5432/aegis?sslmode=disable
          TEST_DATABASE_URL: postgres://aegis:aegis-dev@localhost:5432/aegis?sslmode=disable
          REDIS_URL: localhost:6379

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  audit-conformance:
    name: Audit Conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-dev
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://aegis:aegis-dev@localhost:5432/aegis?sslmode=disable
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: aegis
      DB_PASSWORD: aegis-dev
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # CI-only value. The gateway refuses to start without one of >= 32 chars.
      AEGIS_KEY_PEPPER: ci-only-pepper-not-a-production-secret-000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run migrations
        run: go run ./cmd/migrate -direction up

      - name: Issue an API key for the canary request
        run: |
          set -euo pipefail
          go run ./cmd/keygen \
            -org ci-org -team ci-team -name audit-conformance \
            -env ci -classification INTERNAL -expires 1d | tee /tmp/keygen.out
          key=$(grep -oE 'aegis-ci-[a-z0-9]{32}' /tmp/keygen.out | head -1)
          if [ -z "$key" ]; then
            echo "::error::could not parse an API key out of keygen output"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "TEST_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Start the gateway
        run: |
          go run ./cmd/gateway > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/aegis/v1/health >/dev/null 2>&1; then
              echo "gateway is up"; exit 0
            fi
            if ! kill -0 "$(cat /tmp/gateway.pid)" 2>/dev/null; then
              echo "::error::gateway exited before becoming healthy"; cat /tmp/gateway.log; exit 1
            fi
            sleep 1
          done
          echo "::error::gateway did not become healthy in 60s"; cat /tmp/gateway.log; exit 1

      # The canary test is behind the `integration` build tag, so `go test ./...`
      # in the Test job never compiles it. It needs a live gateway and the audit
      # database, which is why it gets its own job rather than an env var on that
      # one.
      #
      # -p 1 runs the matched packages one at a time. They share a single audit
      # database, and `-run NoPayload` matches tests in two of them:
      # TestNoPayload_CanaryEndToEnd in internal/audit polls audit_events for up
      # to ten seconds waiting for the row it just provoked, while
      # TestEmitterCarriesNoPayload in internal/audit/emitter truncates
      # audit_events to get the clean slate it seals from. Run in parallel, the
      # truncate deletes the row the canary is waiting for and the canary fails
      # having proved nothing. Serialising the packages removes the overlap;
      # the whole job is a few seconds either way.
      #
      # The step asserts the canary PASSED by name rather than trusting the exit
      # code. `go test -run` exits 0 when the pattern matches nothing: rename the
      # test, or move it to another package, and this step stays green having run
      # the very thing it exists to run. The `[no tests to run]` line that
      # internal/audit/checkpoint already prints here is that failure mode in its
      # harmless form, and it is the reason not to rely on the exit code alone.
      #
      # The test itself now fails rather than skips when the three variables are
      # absent, so a dropped env var can no longer pass quietly either. Between
      # them, the two cover both ways this evidence could stop existing without
      # anyone noticing.
      - name: Zero-retention canary
        run: |
          set -euo pipefail
          log=$(mktemp)
          go test ./internal/audit/... -tags=integration -run NoPayload -v -count=1 -p 1 | tee "$log"
          if ! grep -q -- "--- PASS: TestNoPayload_CanaryEndToEnd" "$log"; then
            echo "::error::TestNoPayload_CanaryEndToEnd did not report PASS; the zero-retention claim is unevidenced by this run"
            exit 1
          fi
          echo "zero-retention canary passed by name"
        env:
          TEST_DATABASE_URL: postgres://aegis:aegis-dev@localhost:5432/aegis?sslmode=disable
          TEST_SERVER_URL: http://localhost:8080

      - name: Gateway logs
        if: always()
        run: cat /tmp/gateway.log || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aegis-gateway/aegis-ai-gateway
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  goreleaser:
    name: Release Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      # `check` only validates the schema. It does not catch a files glob that
      # matches nothing -- that fails the real release at the archive step, so
      # build a throwaway release and inspect what actually lands in it.
      - name: Build snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Assert archives carry what the binaries need at runtime
        run: |
          set -uo pipefail
          archive=$(ls dist/*_linux_amd64.tar.gz)
          # Normalise any leading ./ so the checks do not depend on how
          # the archiver happens to spell paths.
          contents=$(tar tzf "$archive" | sed "s|^\./||")
          echo "$contents"
          fail=0
          require() {
            if ! grep -qxF "$1" <<<"$contents"; then
              echo "::error::release archive is missing $1"
              fail=1
            fi
          }
          # Apache-2.0 section 4(d) requires NOTICE to travel with the work.
          require LICENSE
          require NOTICE
          # gateway.yaml ships filter.policy.enabled: true pointing at
          # configs/policies. With no policy file the evaluator stays
          # Enabled() with a nil query and fails closed on every request.
          require configs/gateway.yaml
          require configs/policies/default.rego
          # aegis-migrate defaults to -path migrations, resolved from the
          # working directory, and log.Fatalf()s if it is absent.
          sql=$(grep -cE '^migrations/.+\.sql$' <<<"$contents" || true)
          if [ "${sql:-0}" -eq 0 ]; then
            echo "::error::release archive carries no migrations/*.sql"
            fail=1
          fi
          exit "$fail"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, goreleaser]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
