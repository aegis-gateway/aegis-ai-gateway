version: 2

project_name: aegis-ai-gateway

before:
  hooks:
    - go mod tidy

builds:
  - id: gateway
    main: ./cmd/gateway
    binary: aegis-gateway
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: keygen
    main: ./cmd/keygen
    binary: aegis-keygen
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

  - id: migrate
    main: ./cmd/migrate
    binary: aegis-migrate
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      # Apache-2.0 section 4(d) requires the NOTICE file to travel with any
      # distribution of the work. Added to the repo by the relicense in #20.
      - NOTICE
      - README.md
      - .env.example
      - configs/*.yaml
      # Shipped so the bundled gateway.yaml (filter.policy.enabled: true,
      # bundle_path: configs/policies) can actually load a policy. Without it
      # the evaluator stays Enabled() with no compiled query and fails closed,
      # blocking every request.
      - configs/policies/*.rego
      # aegis-migrate defaults to -path migrations, resolved from the working
      # directory, and log.Fatalf()s if the directory is absent.
      - migrations/*.sql

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
