# The quickstart stack now lives in demos/00-quickstart/docker-compose.yaml.
#
# This file is kept as a working entry point so the previously documented
# command still starts the stack rather than failing with "no services":
#
#   docker compose -f deploy/docker-compose.quickstart.yaml up --build
#
# Prefer ./quickstart.sh — it also provisions .env (provider keys and
# AEGIS_KEY_PEPPER), which this bare Compose path does not.
include:
  - path: ../demos/00-quickstart/docker-compose.yaml
