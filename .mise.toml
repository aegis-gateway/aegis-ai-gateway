#:schema https://mise.jdx.dev/schema/mise.json

# AEGIS AI Gateway — mise-en-place configuration
# Usage: mise run <task>     (e.g. mise run dev)
#        mise run --list     (show all tasks)

[tools]
go = "1.25"
"golangci-lint" = "latest"

[env]
DB_HOST = "localhost"
DB_PORT = "5432"
DB_USER = "aegis"
DB_PASSWORD = "aegis-dev"
DB_NAME = "aegis"
REDIS_HOST = "localhost"
REDIS_PORT = "6379"
REDIS_PASSWORD = ""
DATABASE_URL = "postgres://aegis:aegis-dev@localhost:5432/aegis?sslmode=disable"
# Local-development pepper only. The gateway and keygen refuse to start without
# one of at least 32 characters; a real deployment must set its own. Declared
# before _.file so a value in .env overrides it.
AEGIS_KEY_PEPPER = "aegis-local-development-pepper-not-for-production"
_.file = ".env"

# ── Setup ─────────────────────────────────────────────────────────

[tasks.setup]
description = "Install Go dependencies and verify modules"
run = [
  "go mod download",
  "go mod verify",
  "echo '✓ Dependencies installed'",
]

# ── Docker services ───────────────────────────────────────────────

[tasks."services:up"]
description = "Start PostgreSQL and Redis in Docker"
run = "docker compose -f deploy/docker-compose.yaml up -d --wait"

[tasks."services:down"]
description = "Stop Docker services (preserves data)"
run = "docker compose -f deploy/docker-compose.yaml down"

[tasks."services:destroy"]
description = "Stop Docker services and delete volumes"
run = "docker compose -f deploy/docker-compose.yaml down -v"

[tasks."services:logs"]
description = "Tail Docker service logs"
run = "docker compose -f deploy/docker-compose.yaml logs -f"

# ── Database ──────────────────────────────────────────────────────

[tasks."db:migrate"]
description = "Run database migrations up"
run = "go run ./cmd/migrate -direction up"

[tasks."db:migrate:down"]
description = "Run database migrations down"
run = "go run ./cmd/migrate -direction down"

[tasks."db:reset"]
description = "Drop and recreate database, then migrate"
depends = ["services:up"]
run = """
echo 'Resetting database...'
docker exec aegis-postgres psql -U aegis -c 'DROP DATABASE IF EXISTS aegis;'
docker exec aegis-postgres psql -U aegis -c 'CREATE DATABASE aegis;'
go run ./cmd/migrate -direction up
echo '✓ Database reset complete'
"""

# ── Build ─────────────────────────────────────────────────────────

[tasks.build]
description = "Compile gateway, keygen, and migrate binaries"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
LDFLAGS="-s -w -X main.version=${VERSION}"
go build -ldflags="${LDFLAGS}" -o bin/gateway  ./cmd/gateway
go build -ldflags="${LDFLAGS}" -o bin/keygen   ./cmd/keygen
go build -ldflags="${LDFLAGS}" -o bin/migrate  ./cmd/migrate
echo "✓ Binaries built in ./bin/"
"""
sources = ["cmd/**/*.go", "internal/**/*.go", "go.mod", "go.sum"]
outputs = ["bin/gateway", "bin/keygen", "bin/migrate"]

# ── Test ──────────────────────────────────────────────────────────

[tasks.test]
description = "Run unit tests with race detection and coverage"
run = "go test ./... -v -race -cover"

[tasks."test:integration"]
description = "Run integration tests (starts services and migrates first)"
depends = ["services:up", "db:migrate"]
# ./test/integration/ does not exist and never has. The integration tests live
# beside the code they cover, behind the `integration` build tag.
#
# Two things stop a bare `go test ./... -tags=integration` from working — both
# are tests that demand live infrastructure and fail rather than skip without
# it, which is why this task provides the infrastructure first:
#
#  1. internal/gateway/integration_test.go needs TEST_DATABASE_URL and a Redis
#     on localhost:6379, and it seeds an api_keys row. It fails rather than
#     skips when those are missing — the file spent a long time not compiling
#     under this tag, which no one noticed precisely because nothing insisted
#     on running it.
#  2. TestNoPayload_CanaryEndToEnd fails rather than skips without a running
#     gateway, deliberately, because it backs a public claim. So the task has
#     to provide one.
run = """
set -euo pipefail
export AEGIS_KEY_PEPPER="${AEGIS_KEY_PEPPER:-mise-local-integration-pepper-not-for-production}"
export TEST_DATABASE_URL="${DATABASE_URL}"
export GATEWAY_PORT="${GATEWAY_PORT:-18080}"
export TEST_SERVER_URL="http://localhost:${GATEWAY_PORT}"

key=$(go run ./cmd/keygen -org mise-org -team mise-team -name integration \
        -allowed-models aegis-fast \
        -env dev -classification INTERNAL -expires 1d \
      | grep -oE 'aegis-dev-[a-z0-9]{32}' | head -1)
[ -n "$key" ] || { echo "could not issue an API key" >&2; exit 1; }
export TEST_API_KEY="$key"

# Build first and run the binary directly. `go run` execs the compiled
# program as a *child*, so trapping the `go run` PID would leave the gateway
# holding GATEWAY_PORT after the task finished — and the next run would either
# fail to bind or, worse, silently test against the stale process.
bin=$(mktemp -t aegis-gateway-XXXXXX)
go build -o "$bin" ./cmd/gateway
"$bin" > /tmp/aegis-integration-gateway.log 2>&1 &
gw=$!
trap 'kill "$gw" 2>/dev/null || true; wait "$gw" 2>/dev/null || true; rm -f "$bin"' EXIT

ready=0
for _ in $(seq 1 60); do
  if curl -fsS "http://localhost:${GATEWAY_PORT}/aegis/v1/health" >/dev/null 2>&1; then
    ready=1
    break
  fi
  kill -0 "$gw" 2>/dev/null || { echo "gateway exited before becoming healthy:" >&2; cat /tmp/aegis-integration-gateway.log >&2; exit 1; }
  sleep 1
done
# Without this the loop falls through on timeout and the tests run against a
# gateway that never came up, reporting connection errors as test failures.
[ "$ready" = "1" ] || { echo "gateway did not become healthy within 60s:" >&2; cat /tmp/aegis-integration-gateway.log >&2; exit 1; }

go test ./internal/audit/... ./internal/purge/... ./internal/gateway/... ./internal/storage/... -v -tags=integration -count=1 -p 1
"""

# ── Lint / Format ─────────────────────────────────────────────────

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format Go source files"
run = "go fmt ./..."

# ── Run / Dev ─────────────────────────────────────────────────────

[tasks.dev]
description = "Start gateway with services and migrations"
depends = ["services:up", "db:migrate"]
run = "go run ./cmd/gateway"

[tasks.run]
description = "Start gateway (assumes services already running)"
run = "go run ./cmd/gateway"

# ── Keygen ────────────────────────────────────────────────────────

[tasks.keygen]
description = "Generate a dev API key"
depends = ["services:up", "db:migrate"]
run = """
go run ./cmd/keygen \
  -org dev-org \
  -team dev-team \
  -name dev-key \
  -allowed-models any \
  -classification INTERNAL \
  -expires 365d
"""

# ── Docs ──────────────────────────────────────────────────────────

[tasks."docs:models"]
description = "Regenerate the README model alias table from configs/models.yaml"
run = "./scripts/gen-model-table.sh"

[tasks."docs:models:check"]
description = "Fail if the README model table is out of date (CI)"
run = "./scripts/gen-model-table.sh --check"
